# CI Pipeline — DocAI Backend (ADR-008)
#
# 5 jobs: unit-tests → [integration, bdd-tests, contract-tests] → sonarcloud
# All third-party uses: pinned to full commit SHA (SEC-002).
# MAVEN_OPTS capped at -Xmx512m for jobs 1-4, -Xmx1g for sonarcloud (ADR-008).

name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, develop]

jobs:

  # ── Job 1 ──────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests + ArchUnit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Unit tests + ArchUnit (12 hexagonal rules)
        env:
          MAVEN_OPTS: -Xmx512m -Xms256m
        run: cd backend && mvn clean test -P unit-tests

  # ── Job 2 ──────────────────────────────────────────────────────────────────
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Integration tests (TestContainers — MongoDB, Kafka, LocalStack S3)
        env:
          MAVEN_OPTS: -Xmx512m
          TESTCONTAINERS_REUSE_ENABLE: "true"
          # LocalStack credentials — not real AWS keys (local test profile only)
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: cd backend && mvn clean verify -P integration-tests

  # ── Job 3 ──────────────────────────────────────────────────────────────────
  bdd-tests:
    name: BDD / Cucumber Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: BDD scenarios (@bdd tag — Cucumber + TestContainers)
        env:
          MAVEN_OPTS: -Xmx512m
          TESTCONTAINERS_REUSE_ENABLE: "true"
          BILLING_ENABLED: "false"
        run: cd backend && mvn clean verify -P integration-tests -Dcucumber.filter.tags=@bdd

  # ── Job 4 ──────────────────────────────────────────────────────────────────
  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Spring Cloud Contract — generate + verify
        env:
          MAVEN_OPTS: -Xmx512m
        run: cd backend && mvn spring-cloud-contract:generateTests verify

  # ── Job 5 ──────────────────────────────────────────────────────────────────
  sonarcloud:
    name: SonarCloud / Quality Gates
    runs-on: ubuntu-latest
    needs: [integration, bdd-tests]
    # Only on push events (not PRs) — requires SONAR_TOKEN secret
    if: github.event_name == 'push'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0  # full history required for SonarCloud blame

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Quality gates + PIT mutation testing + SonarCloud analysis
        env:
          # -Xmx1g required for PIT mutation testing (ADR-008)
          MAVEN_OPTS: -Xmx1g
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd backend && mvn verify sonar:sonar \
            -P quality-gates \
            -Dsonar.projectKey=${{ vars.SONAR_ORG }}_docai-backend \
            -Dsonar.organization=${{ vars.SONAR_ORG }}
