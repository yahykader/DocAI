# Production Deployment — manual trigger with required reviewer approval via GitHub Environment
# SEC-002: all third-party uses: pinned to full commit SHA.
# SEC-003: explicit permissions (contents: read).
# Note: id-token: write is pre-positioned for future OIDC migration — currently unused (kubeconfig auth).

name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image SHA tag to deploy (e.g. abc1234...)'
        required: true
        type: string

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production   # GitHub Environment protection — blocks until required reviewer approves
    permissions:
      contents: read
      id-token: write   # pre-positioned for OIDC federation migration — currently unused (kubeconfig auth)

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Configure kubectl (production)
        run: |
          mkdir -p ~/.kube
          printf '%s' "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Roll out new image
        run: |
          kubectl set image deployment/docai-backend \
            docai-backend=ghcr.io/${{ github.repository_owner }}/docai-backend:${{ inputs.image_tag }} \
            --namespace docai-production

      - name: Wait for rollout
        run: kubectl rollout status deployment/docai-backend --namespace docai-production --timeout=120s

      - name: Rollback on failure
        if: failure()
        run: |
          kubectl rollout undo deployment/docai-backend --namespace docai-production
          kubectl rollout status deployment/docai-backend --namespace docai-production --timeout=60s

      - name: Post-deploy health check
        run: curl --fail --show-error --max-time 15 https://app.docai.fr/actuator/health

      - name: Cleanup kubeconfig
        if: always()
        run: rm -f ~/.kube/config
