# Production Deployment — manual trigger with required reviewer approval via GitHub Environment
# SEC-002: all third-party uses: pinned to full commit SHA.
# SEC-003: explicit permissions (contents: read, id-token: write for OIDC federation).

name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image SHA tag to deploy (e.g. abc1234...)'
        required: true
        type: string

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production   # GitHub Environment protection — blocks until required reviewer approves
    permissions:
      contents: read
      id-token: write   # OIDC federation for kubectl auth (TASK-SEC-002)

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure kubectl (production)
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Roll out new image
        run: |
          kubectl set image deployment/docai-backend \
            docai-backend=ghcr.io/${{ github.repository_owner }}/docai-backend:${{ inputs.image_tag }} \
            --namespace docai-production

      - name: Wait for rollout
        run: kubectl rollout status deployment/docai-backend --namespace docai-production --timeout=120s

      - name: Post-deploy health check
        run: curl --fail --silent --max-time 15 https://app.docai.fr/actuator/health
