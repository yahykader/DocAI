spring:
  application:
    name: docai
  profiles:
    active: local

  # MongoDB Configuration
  data:
    mongodb:
      uri: mongodb://admin:password@localhost:27017/docai?authSource=admin&replicaSet=rs0
      auto-index-creation: true

  # Redis/Valkey Configuration
  redis:
    host: localhost
    port: 6379
    timeout: 60000ms
    jedis:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: docai-group
      auto-offset-reset: earliest
      max-poll-records: 100
    producer:
      acks: all
      retries: 3
    properties:
      schema.registry.url: http://localhost:8081
      specific.avro.reader: true

  # Security: Keycloak
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/docai
          jwk-set-uri: http://localhost:8180/realms/docai/protocol/openid-connect/certs

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /api
  compression:
    enabled: true
    min-response-size: 1024

# Management (Actuator, Prometheus, Tracing)
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info,env
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4317

# Logging
logging:
  level:
    root: INFO
    fr.docai: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.mongodb.driver: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Application-specific properties
docai:
  aws:
    region: eu-west-1
    s3-bucket: docai-dev
  ai:
    provider: anthropic
  stripe:
    api-key: ${STRIPE_API_KEY}
  keycloak:
    realm: docai
    admin-username: admin
    admin-password: ${KEYCLOAK_ADMIN_PASSWORD}
