version: '3.9'

services:
  # ==================== DATABASE ====================
  mongodb:
    image: mongo:7.0
    container_name: docai-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: docai
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    command: >
      --replSet rs0
      --bind_ip_all
    healthcheck:
      test: >
        mongosh admin --eval "db.adminCommand('ping')" --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - docai-network

  # MongoDB Replica Set initialization
  mongodb-init:
    image: mongo:7.0
    container_name: docai-mongodb-init
    depends_on:
      mongodb:
        condition: service_healthy
    command: >
      mongosh mongodb:27017/admin
      -u admin
      -p password
      --eval "rs.initiate({
        _id: 'rs0',
        members: [
          { _id: 0, host: 'mongodb:27017' }
        ]
      })"
    networks:
      - docai-network

  # ==================== MESSAGE QUEUE ====================
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: docai-kafka
    ports:
      - "9092:9092"
      - "9094:9094"
      - "29093:29093"
    environment:
      CLUSTER_ID: MkQkQm5iT0eMzM1ZTAxNGM=
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://kafka:9092,PLAINTEXT_INTERNAL://kafka:9094,CONTROLLER://kafka:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - docai-network
    volumes:
      - kafka_data:/var/lib/kafka/data

  # Kafka topic initialization (ADR-002: 8 topics, documentId partition key)
  kafka-init:
    image: confluentinc/cp-kafka:7.7.0
    container_name: docai-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      bash -c '
      echo "Waiting for Kafka to be ready..."
      sleep 10

      echo "Creating topics..."

      # docai.doc.uploaded - 6 partitions, 7 days retention
      kafka-topics --create --if-not-exists \
        --bootstrap-server kafka:29092 \
        --topic docai.doc.uploaded \
        --partitions 6 \
        --replication-factor 1 \
        --config retention.ms=604800000

      # docai.doc.classified - 6 partitions, 7 days retention
      kafka-topics --create --if-not-exists \
        --bootstrap-server kafka:29092 \
        --topic docai.doc.classified \
        --partitions 6 \
        --replication-factor 1 \
        --config retention.ms=604800000

      # docai.doc.extracted - 6 partitions, 7 days retention
      kafka-topics --create --if-not-exists \
        --bootstrap-server kafka:29092 \
        --topic docai.doc.extracted \
        --partitions 6 \
        --replication-factor 1 \
        --config retention.ms=604800000

      # docai.doc.fraud.analyzed - 6 partitions, 7 days retention
      kafka-topics --create --if-not-exists \
        --bootstrap-server kafka:29092 \
        --topic docai.doc.fraud.analyzed \
        --partitions 6 \
        --replication-factor 1 \
        --config retention.ms=604800000

      # docai.doc.completed - 3 partitions, 30 days retention
      kafka-topics --create --if-not-exists \
        --bootstrap-server kafka:29092 \
        --topic docai.doc.completed \
        --partitions 3 \
        --replication-factor 1 \
        --config retention.ms=2592000000

      # docai.doc.failed - 3 partitions, 30 days retention
      kafka-topics --create --if-not-exists \
        --bootstrap-server kafka:29092 \
        --topic docai.doc.failed \
        --partitions 3 \
        --replication-factor 1 \
        --config retention.ms=2592000000

      # docai.doc.dlq - 3 partitions, 90 days retention
      kafka-topics --create --if-not-exists \
        --bootstrap-server kafka:29092 \
        --topic docai.doc.dlq \
        --partitions 3 \
        --replication-factor 1 \
        --config retention.ms=7776000000

      # docai.outbox.relay - 3 partitions, 1 day retention
      kafka-topics --create --if-not-exists \
        --bootstrap-server kafka:29092 \
        --topic docai.outbox.relay \
        --partitions 3 \
        --replication-factor 1 \
        --config retention.ms=86400000

      echo "Topics created successfully"
      '
    networks:
      - docai-network

  # Kafka UI (provectuslabs)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: docai-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: docai
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://apicurio:8081
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - docai-network

  # ==================== SCHEMA REGISTRY ====================
  apicurio:
    image: apicurio/apicurio-registry:2.6.0.Final
    container_name: docai-apicurio
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      QUARKUS_PROFILE: prod
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REGISTRY_ENABLE_DOWNLOAD_Href: 'true'
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - docai-network

  # ==================== CACHE ====================
  valkey:
    image: valkey:8
    container_name: docai-valkey
    ports:
      - "6379:6379"
    command: valkey-server --appendonly yes
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - valkey_data:/data
    networks:
      - docai-network

  # ==================== AUTHENTICATION ====================
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: docai-keycloak
    depends_on:
      keycloak-db:
        condition: service_healthy
    ports:
      - "8180:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HEALTH_ENABLED: 'true'
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: 'true'
      KC_HOSTNAME_STRICT: 'false'
      KC_PROXY: edge
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - docai-network
    volumes:
      - ./realm-docai.json:/opt/keycloak/data/import/realm-docai.json:ro
    command: >
      start
      --import-realm

  keycloak-db:
    image: postgres:16
    container_name: docai-keycloak-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - docai-network

  # ==================== FEATURE FLAGS ====================
  unleash-db:
    image: postgres:16-alpine
    container_name: docai-unleash-db
    ports:
      - "5433:5432"   # offset to avoid conflict with keycloak-db on 5432
    environment:
      POSTGRES_DB: unleash
      POSTGRES_USER: unleash
      POSTGRES_PASSWORD: unleash   # LOCAL PROFILE ONLY — staging/prod uses AWS Secrets Manager (SEC-004)
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U unleash" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - unleash_db_data:/var/lib/postgresql/data
    networks:
      - docai-network

  unleash:
    image: unleashorg/unleash-server:latest
    container_name: docai-unleash
    depends_on:
      unleash-db:
        condition: service_healthy
    ports:
      - "4242:4242"
    environment:
      DATABASE_URL: postgresql://unleash:unleash@unleash-db/unleash   # LOCAL PROFILE ONLY (SEC-004)
      INIT_FRONTEND_API_TOKENS: "*:*.unleash-insecure-api-token"      # LOCAL PROFILE ONLY (SEC-004)
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4242/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - docai-network

  # ==================== OBSERVABILITY ====================
  prometheus:
    image: prom/prometheus:latest
    container_name: docai-prometheus
    ports:
      - "9090:9090"
    environment:
      - TZ=UTC
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - docai-network

  grafana:
    image: grafana/grafana:latest
    container_name: docai-grafana
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - docai-network

  # Grafana Tempo (includes OTLP receiver on port 4317)
  tempo:
    image: grafana/tempo:latest
    container_name: docai-tempo
    ports:
      - "3200:3200"   # HTTP UI
      - "4317:4317"   # OTLP gRPC receiver (integrated)
      - "4318:4318"   # OTLP HTTP receiver (integrated)
    environment:
      - TZ=UTC
    volumes:
      - ./tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    command:
      - '-config.file=/etc/tempo.yml'
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3200/api/status" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - docai-network

volumes:
  unleash_db_data:
    driver: local
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  kafka_data:
    driver: local
  valkey_data:
    driver: local
  keycloak_db_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  tempo_data:
    driver: local

networks:
  docai-network:
    driver: bridge
