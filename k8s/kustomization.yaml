apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base manifests — namespace patched by overlays (staging/ or production/)
# Do NOT run `kubectl apply -f k8s/` directly; use an overlay:
#   kubectl apply -k k8s/overlays/staging
#   kubectl apply -k k8s/overlays/production
resources:
  - deployment.yaml
  - service.yaml
  - hpa.yaml
